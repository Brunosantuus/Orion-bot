services:
  - type: web
    name: orion-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "python bot_telegram.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: TOKEN_ID
        sync: false
      - key: TOKEN_KEY
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ORION_CTRL_TOKEN
        sync: false
      - key: ORION_WEB_SENHA
        sync: false
